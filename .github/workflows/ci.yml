name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install isolated control tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.2.1
        with:
          version: "0.12.9"

      - name: Operational regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_operational_controls.py' && python3 -m unittest discover -s scripts/tests -p 'test_supply_chain.py'

      - name: Workflow structure and dependency licenses
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/supply_chain_check.py

      - name: POSIX smoke parity mock regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_shell_smoke.py'

      - name: Reject secrets and restricted artifacts
        env:
          HYS_RESTRICTED_TERMS_B64: ${{ secrets.HYS_RESTRICTED_TERMS_B64 }}
        run: python3 scripts/policy_check.py --history

  api:
    name: API quality, migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_DB: hys_ci_test
      POSTGRES_USER: hys_owner
      POSTGRES_PASSWORD: ${{ format('CHANGE_ME_CI_OWNER_{0}_{1}', github.run_id, github.run_attempt) }}
      HYS_DB_APP_PASSWORD: ${{ format('CHANGE_ME_CI_APP_{0}_{1}', github.run_id, github.run_attempt) }}
      HYS_ENVIRONMENT: test
      HYS_DATABASE_URL: ${{ format('postgresql+asyncpg://hys_app:CHANGE_ME_CI_APP_{0}_{1}@127.0.0.1:5432/hys_ci_test', github.run_id, github.run_attempt) }}
      HYS_MIGRATION_DATABASE_URL: ${{ format('postgresql+asyncpg://hys_owner:CHANGE_ME_CI_OWNER_{0}_{1}@127.0.0.1:5432/hys_ci_test', github.run_id, github.run_attempt) }}
      HYS_TEST_DATABASE_URL: ${{ format('postgresql+asyncpg://hys_owner:CHANGE_ME_CI_OWNER_{0}_{1}@127.0.0.1:5432/hys_ci_test', github.run_id, github.run_attempt) }}
      HYS_ALLOW_DESTRUCTIVE_TEST_DATABASE: "1"
      PYTHONUTF8: "1"
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: hys_ci_test
          POSTGRES_USER: hys_owner
          POSTGRES_PASSWORD: ${{ format('CHANGE_ME_CI_OWNER_{0}_{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hys_owner -d hys_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.2.1
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python
        run: uv python install 3.14.7

      - name: Install locked dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-groups

      - name: Audit locked Python dependencies and produce inventory
        working-directory: apps/api
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/hys-python-requirements.txt"
          uvx --from pip-audit==2.10.0 pip-audit --requirement "$RUNNER_TEMP/hys-python-requirements.txt" --no-deps --disable-pip
          uv run python ../../scripts/supply_chain_check.py --python-inventory "$RUNNER_TEMP/hys-python-sbom.json"

      - name: Require exactly one current migration head
        working-directory: apps/api
        run: |
          heads="$(uv run alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" = 1
          uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; from hys_api.db.schema import EXPECTED_SCHEMA_REVISION; assert ScriptDirectory.from_config(Config('alembic.ini')).get_current_head() == EXPECTED_SCHEMA_REVISION"

      - name: Format
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Typecheck
        working-directory: apps/api
        run: uv run mypy

      - name: Unit and contract tests
        working-directory: apps/api
        run: uv run pytest -m "not integration" --cov=hys_api --cov-report=term-missing

      - name: Verify versioned OpenAPI contract
        working-directory: apps/api
        run: uv run python scripts/export_openapi.py --check

      - name: Provision least-privilege application role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker cp infra/postgres/init-app-role.sh "$POSTGRES_CONTAINER_ID:/tmp/init-app-role.sh"
          docker exec \
            --env POSTGRES_USER="$POSTGRES_USER" \
            --env POSTGRES_DB="$POSTGRES_DB" \
            --env HYS_DB_APP_PASSWORD="$HYS_DB_APP_PASSWORD" \
            "$POSTGRES_CONTAINER_ID" sh /tmp/init-app-role.sh

          role_flags="$({
            docker exec \
              --env PGPASSWORD="$POSTGRES_PASSWORD" \
              "$POSTGRES_CONTAINER_ID" \
              psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
                --tuples-only --no-align \
                --command "SELECT rolsuper || '|' || rolbypassrls FROM pg_roles WHERE rolname = 'hys_app'"
          } | tr -d '[:space:]')"
          test "$role_flags" = "false|false" || test "$role_flags" = "f|f"

      - name: Integration, migration and tenant-isolation tests
        working-directory: apps/api
        run: uv run pytest -m integration

      - name: Logical synthetic restore drill
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec --env PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER_ID" createdb --username "$POSTGRES_USER" hys_ci_restore_test
          export HYS_DRILL_SOURCE_URL="$HYS_TEST_DATABASE_URL"
          export HYS_DRILL_TARGET_URL="${HYS_TEST_DATABASE_URL%/*}/hys_ci_restore_test"
          python3 scripts/restore_drill.py --allow-synthetic-restore --container "$POSTGRES_CONTAINER_ID"

  web:
    name: Web quality and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HYS_PUBLIC_ORIGIN: https://synthetic.example.invalid
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Dependency inventory and lint guard regressions
        run: |
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/hys-web-sbom.json"
          npm run test:lint

      - name: Verify generated API client
        run: |
          npm run api:generate
          git diff --exit-code -- src/generated/api
          test -z "$(git status --porcelain -- src/generated/api)"

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: &compose-env
      HYS_ENVIRONMENT: test
      HYS_DOMAIN: localhost
      ACME_EMAIL: ci@example.invalid
      POSTGRES_DB: hys_compose_test
      POSTGRES_USER: hys_owner
      POSTGRES_PASSWORD: ${{ format('CHANGE_ME_CI_OWNER_{0}_{1}', github.run_id, github.run_attempt) }}
      HYS_DB_APP_PASSWORD: ${{ format('CHANGE_ME_CI_APP_{0}_{1}', github.run_id, github.run_attempt) }}
      HYS_MIGRATION_DATABASE_URL: ${{ format('postgresql+asyncpg://hys_owner:CHANGE_ME_CI_OWNER_{0}_{1}@db:5432/hys_compose_test', github.run_id, github.run_attempt) }}
      HYS_DATABASE_URL: ${{ format('postgresql+asyncpg://hys_app:CHANGE_ME_CI_APP_{0}_{1}@db:5432/hys_compose_test', github.run_id, github.run_attempt) }}
      HYS_PUBLIC_ORIGIN: https://localhost
      S3_ACCESS_KEY: ${{ format('CHANGE_ME_CI_S3_ACCESS_{0}_{1}', github.run_id, github.run_attempt) }}
      S3_SECRET_KEY: ${{ format('CHANGE_ME_CI_S3_SECRET_{0}_{1}', github.run_id, github.run_attempt) }}
      S3_BUCKET: hys-private-ci
      S3_ENDPOINT: http://seaweedfs:8333
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Resolve and validate Compose model
        run: docker compose config --quiet

  compose-smoke:
    name: Full Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [policy, api, web, compose-config]
    env: *compose-env
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and start stack
        run: docker compose up --detach --build

      - name: Verify public health, synthetic banner and migration
        env:
          HYS_SMOKE_BASE_URL: https://localhost
          HYS_SMOKE_INSECURE_LOCAL_TLS: "1"
        run: sh scripts/smoke.sh

      - name: Install pinned browser journey tooling
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Synthetic browser journey desktop and mobile
        working-directory: apps/web
        env:
          HYS_E2E_BASE_URL: https://localhost
          HYS_E2E_ALLOW_LOCAL_TLS: "1"
          HYS_E2E_ALLOW_SYNTHETIC_MUTATIONS: "1"
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e

      - name: Windows smoke parity mock regressions
        shell: pwsh
        run: ./scripts/tests/smoke.Tests.ps1

      - name: Compose diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          # Raw service logs are not published until privacy redaction is proven.

      - name: Remove ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
